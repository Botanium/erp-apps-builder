name: Shop verification

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shop-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      OPENAI_API_KEY: ""
      SHOP_AI_ENABLED: "false"
      SHOP_VOICE_ENABLED: "false"
      SHOP_AI_BUDGET_MICRO_USD: "0"
    defaults:
      run:
        working-directory: shop-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: shop-app/package-lock.json
      - name: Existing reference regression
        run: node --test test/*.test.mjs
        working-directory: .
      - name: Public release boundary
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$REVIEW_BASE" ]; then REVIEW_BASE=$(git rev-parse HEAD^); fi
          node shop-app/scripts/verify-public.mjs --base="$REVIEW_BASE"
        working-directory: .
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:bundle
      - run: npx playwright install --with-deps chromium
      - run: node tests/voice-consent.browser.mjs
      - run: npm run test:e2e
      - name: Local Netlify adapter qualification (no cloud)
        run: SHOP_LOCAL_QUALIFICATION=true node scripts/qualify-netlify-build.mjs
      - name: Isolated PostgreSQL and generated-handler qualification
        run: |
          docker pull postgres:17-alpine
          SHOP_QUALIFY_NETLIFY=true npm run test:postgres
      - name: Browser failure evidence only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shop-e2e-failure
          path: |
            shop-app/output/playwright/e2e/artifacts/
            shop-app/output/playwright/e2e/report/
          retention-days: 7
          if-no-files-found: ignore
